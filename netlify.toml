[build]
  publish = "."

[[redirects]]
  # Route all standard paths to index.html for SPA support
  # BUT don't force it if the file actually exists on the server
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*.tsx"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.ts"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com https://esm.sh https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.anatomyguru.in https://*.anatomyguru.in; connect-src 'self' blob: https://generativelanguage.googleapis.com https://*.googleapis.com; worker-src 'self' blob: https://cdnjs.cloudflare.com;"
