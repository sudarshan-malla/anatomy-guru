<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatomyGuru Audit Engine</title>
    
    <script>
      // Force process.env to exist before any modules load
      const mockProcess = {
        env: { NODE_ENV: 'production', API_KEY: '' },
        cwd: () => '/',
        browser: true
      };
      window.process = mockProcess;
      globalThis.process = mockProcess;
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; min-height: 100vh; }
        @media print { .no-print { display: none !important; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
    "@google/genai": "https://esm.sh/@google/genai@1.4.0",
    "mammoth": "https://esm.sh/mammoth@1.8.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174",
    "docx": "https://esm.sh/docx@9.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>

    <script>
      // Fallback UI if Javascript fails to load or execute
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.src || e.target.href)) {
          const root = document.getElementById('root');
          if (root && !root.innerHTML.trim()) {
            root.innerHTML = `
              <div style="padding: 40px; text-align: center; color: #e11d48; font-family: sans-serif; max-width: 500px; margin: 0 auto;">
                <h2 style="font-weight: 900; margin-bottom: 10px;">Connection Error</h2>
                <p style="color: #475569;">We couldn't load the application modules. This is usually due to a network restriction or a missing file.</p>
                <div style="background: #f1f5f9; padding: 10px; border-radius: 6px; margin: 20px 0; font-size: 12px; text-align: left; overflow-x: auto;">
                  <code>Failed to load: ${e.target.src || e.target.href}</code>
                </div>
                <button onclick="location.reload()" style="padding: 12px 24px; background: #0f172a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Try Again</button>
              </div>
            `;
          }
        }
      }, true);
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
